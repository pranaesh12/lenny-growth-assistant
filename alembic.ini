# ==================================================================
# Alembic Configuration
# Lenny Growth Assistant — Backend
#
# NOTE: `sqlalchemy.url` is intentionally left unset here. The real
# database URL is injected at runtime inside `alembic/env.py` via
# `app.core.config.get_settings()`, so this project's single source
# of truth for configuration (Settings) is never bypassed or
# duplicated. Do not add a `sqlalchemy.url` value to this file.
# ==================================================================

[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration filenames.
# Includes a timestamp prefix for chronological sorting in `versions/`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Ensure the project root is importable from env.py
# (so `import app.core.config` etc. resolve correctly).
prepend_sys_path = .

# Timezone used when generating revision timestamps in filenames.
# Left as UTC for consistency across dev machines/CI/production,
# regardless of local system timezone.
timezone = UTC

# Truncate long slugs in filenames to keep them readable.
truncate_slug_length = 40

# Do not run environment scripts on `alembic revision` when only
# generating a new script file without --autogenerate (kept default/False
# so importing models etc. only happens when actually needed).
# revision_environment = false

# Do not source .env directly here — Settings (via pydantic-settings)
# already loads `.env`, and env.py uses Settings exclusively.
# sqlalchemy.url is deliberately omitted (see note above).

[post_write_hooks]
# No post-write formatting hooks configured in this phase.
# (Optional future addition: auto-run `black`/`isort` on generated
# migration files via post_write_hooks — deferred, not needed now.)

# ------------------------------------------------------------------
# Logging configuration
# ------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S